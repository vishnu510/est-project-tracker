<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- GROUP 1: 'e' circle (Navy) -->
  <g transform="translate(120, 110)">
    <!-- Navy base circle with smooth cut out -->
    <path d="M 0,-80 
             A 80,80 0 1,1 -76,-25 
             C -60,-65 -20,-75 25,-60 
             C 65,-45 75,0 55,45 
             C 40,75 -10,85 -50,65 
             C -80,45 -85,0 -70,-35 
             A 80,80 0 0,0 0,80 
             A 80,80 0 0,0 0,-80 Z" 
          fill="#1c355e" />
    <!-- White stylized 'e' core -->
    <path d="M -55,-10 
             C -55,-48 -25,-65 10,-65 
             C 50,-65 72,-35 65,10 
             L -35,10 
             C -32,32 -10,48 20,44 
             C 42,40 54,26 60,18 
             L 75,32 
             C 62,54 42,66 12,66 
             C -35,66 -55,30 -55,-10 Z 
             M -32,-8 
             L 46,-8 
             C 44,-28 30,-48 10,-48 
             C -12,-48 -28,-30 -32,-8 Z" 
          fill="#ffffff" />
    <!-- Inner Navy Swoosh -->
    <path d="M -15,-20 
             C 10,-20 28,-5 25,20 
             C 22,45 -5,55 -30,45 
             C -55,35 -60,0 -35,-15 
             C -25,-20 -20,-20 -15,-20 Z" 
          fill="#1c355e" />
  </g>

  <!-- GROUP 2: 's' circle (Red-Orange) -->
  <g transform="translate(370, 110)">
    <!-- Coral Red circle base -->
    <circle cx="0" cy="0" r="80" fill="#e2402b" />
    <!-- White dynamic 's' wave cutout -->
    <path d="M 45,-65 
             C 5,-65 -30,-40 -30,-5 
             C -30,30 25,20 25,48 
             C 25,62 10,68 -10,65 
             C -35,62 -48,42 -55,30 
             L -72,45 
             C -60,70 -35,82 0,82 
             C 45,82 72,55 72,25 
             C 72,-15 15,-25 15,-48 
             C 15,-60 28,-65 42,-62 
             C 60,-58 70,-45 76,-35 
             L 88,-52 
             C 78,-68 62,-65 45,-65 Z" 
          fill="#ffffff" />
  </g>

  <!-- GROUP 3: 't' circle (Teal) -->
  <g transform="translate(620, 110)">
    <!-- Teal Circle base -->
    <circle cx="0" cy="0" r="80" fill="#3898b2" />
    <!-- White stylized 't' -->
    <path d="M -40,-80 
             L 5,-80 
             L 5,-40 
             L 45,-40 
             L 45,-15 
             L 5,-15 
             L 5,35 
             C 5,55 18,65 38,65 
             C 48,65 58,60 65,54 
             L 72,75 
             C 58,85 40,88 20,88 
             C -20,88 -40,65 -40,25 
             L -40,-15 
             L -60,-15 
             L -60,-40 
             L -40,-40 Z" 
          fill="#ffffff" />
  </g>

  <!-- BOTTOM TEXT: BRAND SERVICES -->
  <text x="370" y="275" 
        text-anchor="middle" 
        font-family="'Outfit', 'Inter', -apple-system, sans-serif" 
        font-size="44" 
        font-weight="700" 
        letter-spacing="18" 
        fill="#ffffff">
    BRAND SERVICES
  </text>
</svg>
